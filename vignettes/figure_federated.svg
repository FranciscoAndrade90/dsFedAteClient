<svg width="100%" viewBox="0 0 500 230" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrowFed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Site 1 / Server 1 -->
<rect x="20" y="20" width="110" height="40" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="75" y="33" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#2c2c2a">Site 1</text>
<text x="75" y="48" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5f5e5a">Server 1</text>

<text x="75" y="83" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5f5e5a">⋮</text>

<!-- Site 2 / Server 2 -->
<rect x="20" y="90" width="110" height="40" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="75" y="103" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#2c2c2a">Site 2</text>
<text x="75" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5f5e5a">Server 2</text>

<text x="75" y="153" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5f5e5a">⋮</text>

<!-- Site K / Server K -->
<rect x="20" y="160" width="110" height="40" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="75" y="173" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#2c2c2a">Site K</text>
<text x="75" y="188" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5f5e5a">Server K</text>

<!-- Analyst / Client -->
<rect x="370" y="90" width="110" height="40" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="425" y="103" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#2c2c2a">Analyst</text>
<text x="425" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5f5e5a">Client</text>

<!-- Arrow: Site 1 → Analyst -->
<path d="M130 40 C 220 40 280 110 370 110" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrowFed)"/>

<!-- Arrow: Site 2 → Analyst -->
<line x1="130" y1="110" x2="370" y2="110" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrowFed)"/>

<!-- Arrow: Site K → Analyst -->
<path d="M130 180 C 220 180 280 110 370 110" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrowFed)"/>

<!-- Label -->
<text x="250" y="101" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5f5e5a">aggregated statistics</text>

<!-- Privacy note -->
<text x="75" y="220" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5f5e5a" font-style="italic">individual data stays local</text>
</svg>
