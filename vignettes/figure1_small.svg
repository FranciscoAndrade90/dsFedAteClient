<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Nodes -->
<rect x="80" y="30" width="60" height="40" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="110" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">H</text>

<rect x="260" y="30" width="60" height="40" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="290" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">X</text>

<rect x="80" y="110" width="60" height="40" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="110" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">W</text>

